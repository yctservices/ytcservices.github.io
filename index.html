<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-50 text-slate-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自助下单中心</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.03);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.08);
            border-radius: 4px;
        }
    </style>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="h-full flex flex-col font-sans overflow-hidden select-none bg-slate-50">

    <!-- Header Section -->
    <header class="glass px-4 py-4 flex flex-col gap-2 shrink-0 border-b border-slate-200/80">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="p-2 bg-brand-500/10 text-brand-600 rounded-lg">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold tracking-wide text-slate-800">网页自助下单中心</h1>
                    <p class="text-[10px] text-slate-500">服务费用将直接从您的机器人钱包中扣除</p>
                </div>
            </div>
            <div class="text-right">
                <span id="user-name-display" class="text-xs font-semibold text-slate-700 block">用户账户</span>
                <span id="user-id-display" class="text-[10px] text-slate-400 block">ID: --</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto px-4 py-4 space-y-4">
        
        <!-- Search and Dropdown Category Selector -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <!-- Dropdown Category Selector -->
            <div class="relative">
                <i data-lucide="layers" class="absolute left-3.5 top-3 w-4 h-4 text-slate-400"></i>
                <select id="category-select" onchange="onCategorySelectChange()" class="w-full pl-10 pr-10 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 text-xs text-slate-700 shadow-sm appearance-none cursor-pointer">
                    <!-- Dynamic Categories -->
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </div>
            </div>

            <!-- Search input -->
            <div class="relative">
                <i data-lucide="search" class="absolute left-3.5 top-3 w-4 h-4 text-slate-400"></i>
                <input type="text" id="search-input" oninput="filterServices()" placeholder="搜索您需要的商品服务或ID..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 text-xs text-slate-700 shadow-sm">
            </div>
        </div>

        <!-- Services List -->
        <div class="space-y-2.5" id="services-container">
            <div class="text-center py-10 text-slate-400 text-xs">
                正在载入商品数据，请稍候...
            </div>
        </div>

    </main>

    <!-- Order Drawer (Modal / Bottom Sheet) -->
    <div id="order-drawer" class="fixed inset-0 z-50 bg-slate-900/30 flex items-end justify-center hidden">
        <div class="glass w-full rounded-t-3xl p-6 space-y-4 max-h-[85vh] overflow-y-auto transform translate-y-full transition-transform duration-300">
            <div class="flex justify-between items-center pb-2 border-b border-slate-200">
                <div class="flex items-center gap-2">
                    <span class="p-1.5 bg-brand-500/10 text-brand-600 rounded-lg text-xs font-semibold">🛍️ 下单</span>
                    <h3 class="text-sm font-bold text-slate-800">确认商品订单</h3>
                </div>
                <button onclick="closeOrderDrawer()" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Selected Product Info -->
            <div class="bg-slate-100/80 p-3 rounded-xl border border-slate-200/50 space-y-1.5 text-xs">
                <div>
                    <span class="text-[10px] text-slate-500">服务名称</span>
                    <p id="drawer-product-name" class="font-semibold text-slate-700"></p>
                </div>
                <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-200">
                    <div>
                        <span class="text-[10px] text-slate-500 block">单价</span>
                        <span id="drawer-product-rate" class="font-semibold text-brand-600">¥0.00</span>
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-500 block">起购数</span>
                        <span id="drawer-product-min" class="font-semibold text-slate-700">1</span>
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-500 block">限购数</span>
                        <span id="drawer-product-max" class="font-semibold text-slate-700">10000</span>
                    </div>
                </div>
            </div>

            <!-- Form Inputs -->
            <div class="space-y-4 text-xs">
                <div>
                    <label class="block text-[10px] text-slate-500 mb-1 uppercase tracking-wider font-semibold">目标下单链接 (Link)</label>
                    <input type="text" id="order-link" required placeholder="请粘贴目标 Telegram 频道、帖子或账户链接..." class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 text-xs text-slate-700 shadow-sm">
                </div>

                <div>
                    <label class="block text-[10px] text-slate-500 mb-1 uppercase tracking-wider font-semibold">下单数量 (Quantity)</label>
                    <input type="number" id="order-quantity" required oninput="calculateTotal()" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-brand-500 text-xs text-slate-700 shadow-sm" placeholder="请输入起购限购范围内的数量">
                </div>

                <div class="flex items-center justify-between p-3 bg-brand-500/5 rounded-xl border border-brand-500/10">
                    <div>
                        <span class="text-[10px] text-slate-500 block font-semibold">订单预计总费用:</span>
                        <span class="text-[9px] text-slate-400">(按最终下单数计费)</span>
                    </div>
                    <span id="order-total-price" class="text-lg font-bold text-brand-600">¥0.00</span>
                </div>

                <button type="button" onclick="submitOrder()" class="w-full py-3 bg-brand-600 hover:bg-brand-500 transition-all font-semibold rounded-xl text-white shadow-lg shadow-brand-500/10 text-xs flex items-center justify-center gap-2">
                    <i data-lucide="zap" class="w-4 h-4"></i> 🚀 立即提交并扣款下单
                </button>
            </div>
        </div>
    </div>

    <!-- Frontend WebApp Controller Logic -->
    <script>
        // Global Logger
        function logDebug(msg, type = 'info') {
            const container = document.getElementById('debug-log-container');
            if (container) {
                const color = type === 'error' ? 'text-red-400' : (type === 'warn' ? 'text-yellow-400' : 'text-slate-700');
                container.innerHTML += `<div class="${color} py-0.5 border-b border-slate-100">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
                container.scrollTop = container.scrollHeight;
            }
            console.log(`[${type}] ${msg}`);
        }

        window.onerror = function (message, source, lineno, colno, error) {
            logDebug(`ERR: ${message} (${lineno}:${colno})`, 'error');
            return false;
        };

        window.addEventListener('unhandledrejection', function (event) {
            logDebug(`PROMISE REJ: ${event.reason}`, 'error');
        });

        let services = [];
        let categories = [];
        let activeCategory = '';
        let selectedProduct = null;

        logDebug("Script parsed. Checking Telegram SDK...");
        const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        if (tg) {
            logDebug("Telegram SDK loaded successfully.");
            tg.ready();
            tg.expand(); // Expand full height
        } else {
            logDebug("Telegram SDK NOT found!", "warn");
        }

        window.addEventListener('DOMContentLoaded', () => {
            logDebug("DOMContentLoaded event triggered");
            // Apply User Info from Telegram
            let user = (tg && tg.initDataUnsafe) ? tg.initDataUnsafe.user : null;
            
            // 备用解析方案 1：从原始 tg.initData 查询串中解析 user
            if (!user && tg && tg.initData) {
                try {
                    const params = new URLSearchParams(tg.initData);
                    const userRaw = params.get('user');
                    if (userRaw) {
                        user = JSON.parse(decodeURIComponent(userRaw));
                    }
                } catch (e) {
                    console.error("从 initData 解析用户数据失败:", e);
                }
            }

            // 备用解析方案 2：从浏览器 window.location.search 中解析
            if (!user && window.location.search) {
                try {
                    const urlParams = new URLSearchParams(window.location.search);
                    const queryInitData = urlParams.get('tgWebAppData') || urlParams.get('initData');
                    if (queryInitData) {
                        const params = new URLSearchParams(queryInitData);
                        const userRaw = params.get('user');
                        if (userRaw) {
                            user = JSON.parse(decodeURIComponent(userRaw));
                        }
                    }
                } catch (e) {
                    console.error("从 URL 查找并解析用户数据失败:", e);
                }
            }

            if (user) {
                document.getElementById('user-name-display').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
                document.getElementById('user-id-display').innerText = 'ID: ' + user.id;
            } else {
                document.getElementById('user-name-display').innerText = '访客账户';
                document.getElementById('user-id-display').innerText = 'ID: 未关联';
            }

            loadServicesData();
            try {
                lucide.createIcons({attrs: {"data-lucide": true}});
            } catch (e) {
                console.error("Lucide icons load error", e);
            }
        });

        async function loadServicesData() {
            try {
                // Fetch the static cache file
                const res = await fetch('services.json');
                if (res.ok) {
                    services = await res.json();
                    
                    // Parse categories
                    categories = [...new Set(services.map(s => s.category))];
                    if (categories.length > 0) activeCategory = categories[0];

                    renderCategoryDropdown();
                    renderServices();
                } else {
                    document.getElementById('services-container').innerHTML = `
                        <div class="text-center py-10 text-red-500 text-xs">
                            获取商品列表失败，请联系管理员确认配置。
                        </div>
                    `;
                }
            } catch (e) {
                document.getElementById('services-container').innerHTML = `
                    <div class="text-center py-10 text-red-500 text-xs">
                        网络请求失败，请刷新重试。
                    </div>
                `;
            }
        }

        function renderCategoryDropdown() {
            const select = document.getElementById('category-select');
            select.innerHTML = '';

            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                if (activeCategory === cat) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function onCategorySelectChange() {
            const select = document.getElementById('category-select');
            activeCategory = select.value;
            renderServices();
        }

        function renderServices() {
            const container = document.getElementById('services-container');
            container.innerHTML = '';

            const keyword = document.getElementById('search-input').value.toLowerCase().trim();

            const filtered = services.filter(s => {
                const matchKeyword = s.service.toString().includes(keyword) || 
                                     s.name.toLowerCase().includes(keyword) ||
                                     (s.custom_id && s.custom_id.toLowerCase().includes(keyword));
                const matchCategory = !keyword && s.category === activeCategory;
                return matchKeyword && matchCategory;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-400 text-xs">
                        没有找到匹配的服务商品。
                    </div>
                `;
                return;
            }

            filtered.forEach(s => {
                const priceUnit = s.type.toLowerCase() === 'package' ? '个' : 'k';
                const displayId = s.custom_id || s.service;

                const card = document.createElement('div');
                card.className = 'glass p-4 rounded-xl flex items-center justify-between gap-4 active:bg-slate-100/50 transition-all cursor-pointer bg-white';
                card.onclick = () => openOrderDrawer(s);

                card.innerHTML = `
                    <div class="flex-1 space-y-1">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <span class="px-2 py-0.5 bg-brand-500/10 text-brand-600 font-mono text-[9px] rounded font-semibold border border-brand-500/10">
                                ID: ${displayId}
                            </span>
                            <span class="text-slate-400 font-mono text-[9px]">
                                起购: ${s.min} | 限购: ${s.max}
                            </span>
                        </div>
                        <h4 class="text-xs font-semibold text-slate-755 line-clamp-2">${s.name}</h4>
                    </div>
                    <div class="text-right shrink-0">
                        <span class="text-brand-600 font-bold text-sm block">¥${s.rate.toFixed(2)}</span>
                        <span class="text-[9px] text-slate-400">每 ${priceUnit === 'k' ? '1000' : '1'} 个</span>
                    </div>
                `;
                container.appendChild(card);
            });
            try {
                lucide.createIcons({attrs: {"data-lucide": true}});
            } catch (e) {
                console.error("Lucide icons load error", e);
            }
        }

        function filterServices() {
            renderServices();
        }

        // Drawer Operations
        function openOrderDrawer(product) {
            selectedProduct = product;
            const priceUnit = product.type.toLowerCase() === 'package' ? '每个' : '每 1000 个';

            document.getElementById('drawer-product-name').innerText = product.name;
            document.getElementById('drawer-product-rate').innerText = `¥${product.rate.toFixed(2)} / ${priceUnit}`;
            document.getElementById('drawer-product-min').innerText = product.min;
            document.getElementById('drawer-product-max').innerText = product.max;

            // Set validation inputs
            const qtyInput = document.getElementById('order-quantity');
            qtyInput.min = product.min;
            qtyInput.max = product.max;
            qtyInput.placeholder = `范围: ${product.min} - ${product.max}`;
            qtyInput.value = '';

            document.getElementById('order-link').value = '';
            document.getElementById('order-total-price').innerText = '¥0.00';

            const drawer = document.getElementById('order-drawer');
            drawer.classList.remove('hidden');
            setTimeout(() => {
                drawer.firstElementChild.classList.remove('translate-y-full');
            }, 10);
        }

        function closeOrderDrawer() {
            const drawer = document.getElementById('order-drawer');
            drawer.firstElementChild.classList.add('translate-y-full');
            setTimeout(() => {
                drawer.classList.add('hidden');
                selectedProduct = null;
            }, 300);
        }

        function calculateTotal() {
            if (!selectedProduct) return;
            const qty = parseInt(document.getElementById('order-quantity').value) || 0;
            const isPackage = selectedProduct.type.toLowerCase() === 'package';
            
            let total = 0;
            if (isPackage) {
                total = selectedProduct.rate * qty;
            } else {
                total = (selectedProduct.rate / 1000.0) * qty;
            }

            document.getElementById('order-total-price').innerText = `¥${total.toFixed(2)}`;
        }

        function submitOrder() {
            try {
                if (!tg) {
                    alert("错误：未能加载 Telegram WebApp 官方组件库，请退出并重新加载网页。");
                    return;
                }
                if (!selectedProduct) {
                    tg.showAlert("错误：未选择商品数据");
                    return;
                }

                const link = document.getElementById('order-link').value.trim();
                const qty = parseInt(document.getElementById('order-quantity').value);

                if (!link) {
                    tg.showAlert('请输入下单的目标链接地址！');
                    return;
                }

                if (isNaN(qty) || qty < selectedProduct.min || qty > selectedProduct.max) {
                    tg.showAlert(`请输入合法的下单数量 (起购: ${selectedProduct.min}, 限购: ${selectedProduct.max})！`);
                    return;
                }

                // WebApp Magic closed-loop transfer!
                const orderPayload = {
                    service_id: selectedProduct.service,
                    link: link,
                    quantity: qty
                };

                logDebug("orderPayload prepared: " + JSON.stringify(orderPayload));
                if (tg) {
                    logDebug("Invoking tg.sendData...");
                    tg.sendData(JSON.stringify(orderPayload));
                    logDebug("tg.sendData invoked.");
                } else {
                    logDebug("Cannot send data: Telegram SDK not available!", "error");
                }
            } catch (err) {
                logDebug("JS Run Exception: " + err.message, "error");
                tg.showAlert("JS 运行异常: " + err.message);
            }
        }
    </script>

    <!-- Collapsible Debug Console Panel -->
    <div id="debug-panel" class="fixed bottom-0 left-0 right-0 z-[100] bg-white text-slate-700 font-mono text-[9px] p-2 max-h-[25vh] overflow-y-auto border-t border-slate-200 shadow-lg">
        <div class="flex justify-between items-center mb-1 text-slate-800 border-b border-slate-200 pb-1 font-semibold">
            <span>⚙️ 网页控制台日志 (调试用)</span>
            <button onclick="document.getElementById('debug-log-container').innerHTML=''" class="text-red-500 underline">清空</button>
        </div>
        <div id="debug-log-container" class="space-y-1"></div>
    </div>
</body>
</html>
